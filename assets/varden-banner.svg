  <path d="M166 369 L169 358 L172 369 Z" fill="#f7f3ed" />
  <path d="M240 332 L262 342 L242 350 Z" fill="#f7f3ed" />
  <circle cx="206" cy="318" r="4.5" fill="#a8102f" />
  <circle cx="155" cy="328" r="2.2" fill="#a8102f" />
  <path d="M193 309 L219 306" stroke="#ded6e6" stroke-width="2.4" stroke-linecap="round" />
  <path d="M160 350 C150 356 146 366 148 374" fill="none" stroke="#c81f45" stroke-width="3" stroke-linecap="round" />

