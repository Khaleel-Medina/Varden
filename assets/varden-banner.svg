  <path d="M300 392 L338 382 L306 408 Z" fill="#f7f3ed" />
  <path d="M282 430 L320 432 L286 448 Z" fill="#f7f3ed" />
  <path d="M252 500 L288 500 L256 516 Z" fill="#f7f3ed" />
  <path d="M212 404 L176 392 L210 420 Z" fill="#f7f3ed" />
  <path d="M204 434 L168 432 L200 450 Z" fill="#f7f3ed" />

  <!-- neck -->
  <path d="M252 332 C248 348 248 358 250 370" fill="none" stroke="#5b2166" stroke-width="31" stroke-linecap="round" />
  <path d="M252 332 C248 348 248 358 250 370" fill="none" stroke="#f7f3ed" stroke-width="26" stroke-linecap="round" />

