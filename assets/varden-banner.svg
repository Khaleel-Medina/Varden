<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 640" width="512" height="640" role="img" aria-label="Varden banner: a white dragon with spread wings coiled around a downward-pointing sword, a red rose in its claw, on a purple field">
  <defs>
    <radialGradient id="field" cx="50%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#7d3089" />
      <stop offset="54%" stop-color="#5b2166" />
      <stop offset="100%" stop-color="#381240" />
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cdc6da" />
      <stop offset="42%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dbd4e6" />
    </linearGradient>

    <g id="wing">
      <path d="M236 288
               C216 228 186 150 150 86
               C136 102 120 126 108 154
               Q132 160 140 178
               C132 190 124 200 118 208
               Q140 210 152 226
               C150 232 150 240 150 246
               C182 258 214 272 236 288 Z" fill="#f7f3ed" />
      <path d="M230 280 C210 222 188 158 156 98" fill="none" stroke="#ded6e6" stroke-width="3.2" stroke-linecap="round" />
      <path d="M224 268 C186 222 154 186 120 158" fill="none" stroke="#ded6e6" stroke-width="2.6" stroke-linecap="round" />
    </g>
  </defs>

  <rect width="512" height="640" fill="url(#field)" />

  <use href="#wing" />
  <use href="#wing" transform="translate(512 0) scale(-1 1)" />

  <!-- far hind leg and rear coil, behind the blade -->
  <path d="M268 396 C282 410 292 424 296 436" fill="none" stroke="#5b2166" stroke-width="16" stroke-linecap="round" />
  <path d="M268 396 C282 410 292 424 296 436" fill="none" stroke="#e6dfee" stroke-width="12" stroke-linecap="round" />
  <path d="M296 436 C304 444 310 452 308 460 M300 440 C308 448 316 452 322 452" fill="none" stroke="#5b2166" stroke-width="10" stroke-linecap="round" />
  <path d="M296 436 C304 444 310 452 308 460 M300 440 C308 448 316 452 322 452" fill="none" stroke="#e6dfee" stroke-width="6" stroke-linecap="round" />
  <path d="M236 348 C304 356 306 406 242 418" fill="none" stroke="#5b2166" stroke-width="20" stroke-linecap="round" />
  <path d="M236 348 C304 356 306 406 242 418" fill="none" stroke="#e2dbea" stroke-width="16" stroke-linecap="round" />

  <!-- sword, point down -->
  <path d="M192 208 C228 226 284 226 320 208 L320 222 C284 242 228 242 192 222 Z" fill="url(#steel)" />
  <rect x="249" y="168" width="14" height="42" rx="5" fill="#e7e1ee" />
  <path d="M249 178 H263 M249 188 H263 M249 198 H263" stroke="#bdb4c9" stroke-width="2" />
  <circle cx="256" cy="158" r="9" fill="#f7f3ed" />
  <path d="M251 232 H261 L259 592 L256 622 L253 592 Z" fill="url(#steel)" />
  <path d="M256 246 V584" stroke="#c7bfd4" stroke-width="1.6" />

