  <path d="M258 392 C246 400 234 406 222 410" fill="none" stroke="#f7f3ed" stroke-width="13" stroke-linecap="round" />
  <path d="M220 410 C210 406 202 398 198 390 M220 414 C208 414 198 410 190 404 M222 418 C212 424 202 426 192 424" fill="none" stroke="#5b2166" stroke-width="10" stroke-linecap="round" />
  <path d="M220 410 C210 406 202 398 198 390 M220 414 C208 414 198 410 190 404 M222 418 C212 424 202 426 192 424" fill="none" stroke="#f7f3ed" stroke-width="6" stroke-linecap="round" />

  <!-- the rose in the claw -->
  <g transform="translate(168 408)">
    <circle r="15" fill="#c81f45" stroke="#5b2166" stroke-width="3" />
    <path d="M-8 -7 C-3 -14 8 -12 11 -5 C14 3 7 12 -2 11 C-10 10 -15 1 -8 -7 Z" fill="#e83f63" />
    <path d="M-5 0 C-2 -5 5 -4 5 1 C5 7 -2 8 -5 4" fill="none" stroke="#8d0d28" stroke-width="2.2" stroke-linecap="round" />
